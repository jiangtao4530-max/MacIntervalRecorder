name: Build macOS App

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Build release app
        run: |
          xcodebuild \
            -project MacIntervalRecorder.xcodeproj \
            -scheme MacIntervalRecorder \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Apply ad-hoc signature
        run: |
          codesign --force --deep --sign - \
            --entitlements MacIntervalRecorder/MacIntervalRecorder.entitlements \
            build/Build/Products/Release/MacIntervalRecorder.app
          codesign --verify --deep --strict --verbose=2 \
            build/Build/Products/Release/MacIntervalRecorder.app

      - name: Package app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/Build/Products/Release/MacIntervalRecorder.app \
            MacIntervalRecorder.app.zip

      - name: Upload downloadable app
        uses: actions/upload-artifact@v4
        with:
          name: MacIntervalRecorder-macOS
          path: MacIntervalRecorder.app.zip
          if-no-files-found: error

